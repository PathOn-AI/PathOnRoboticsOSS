<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="PathOn Dexterous Hand V3 — files not yet released">
  <rect width="800" height="450" fill="#f3f4f6"/>
  <g fill="none" stroke="#c9cfd8" stroke-width="6" stroke-linecap="round">
    <!-- palm -->
    <rect x="330" y="270" width="140" height="110" rx="18"/>
    <!-- three fingers -->
    <path d="M355 270 V190 a16 16 0 0 1 32 0 V270"/>
    <path d="M400 270 V160 a16 16 0 0 1 32 0 V270"/>
    <path d="M445 270 V190 a16 16 0 0 1 32 0 V270"/>
    <!-- spread arc -->
    <path d="M300 300 a110 110 0 0 1 200 0" stroke-dasharray="10 12"/>
  </g>
  <text x="400" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="30" font-weight="700" fill="#111827">Dexterous Hand V3</text>
  <text x="400" y="98" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" fill="#6b7280">Barrett-style — 8 joints, 4 motors</text>
  <text x="400" y="425" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="600" fill="#16a34a">Files not yet released</text>
</svg>
